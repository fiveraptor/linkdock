name: Checks and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Test
        run: npm test
      - name: Build release packages
        run: npm run package
      - name: Validate ZIP archives
        run: python3 -c "import pathlib, zipfile; [zipfile.ZipFile(p).testzip() is None or (_ for _ in ()).throw(RuntimeError(str(p))) for p in pathlib.Path('dist/releases').glob('*.zip')]"
      - uses: actions/upload-artifact@v4
        with:
          name: linkdock-packages
          path: dist/releases/*.zip
          if-no-files-found: error
